<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f6fa">
  <meta name="description" content="IBAN bilgilerini kolayca görüntüleyin ve kopyalayın.">
  <title>IBAN Paylaşımı</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      --page: #f3f6fa;
      --card: rgba(255, 255, 255, .88);
      --text: #172235;
      --muted: #78859a;
      --line: #e8edf4;
      --accent: #315ee8;
      --accent-dark: #244bc4;
      --success: #168657;
      --success-dark: #11734a;
      --shadow: 0 24px 70px rgba(34, 52, 86, .12), 0 3px 12px rgba(34, 52, 86, .04);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0c1220;
        --card: rgba(22, 31, 48, .94);
        --text: #edf2fb;
        --muted: #9aa8bd;
        --line: #2a3548;
        --accent: #7795ff;
        --accent-dark: #91a8ff;
        --success: #35b77c;
        --success-dark: #49c98f;
        --shadow: 0 24px 70px rgba(0, 0, 0, .34), 0 3px 12px rgba(0, 0, 0, .18);
      }
    }

    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      min-height: 100%;
      background: var(--page);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
      display: grid;
      place-items: center;
      overflow: auto;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% -18%, rgba(80, 119, 236, .12), transparent 55%),
        var(--page);
    }

    main {
      width: min(100%, 440px);
      margin: auto;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: clamp(26px, 7vw, 40px);
      border: 1px solid rgba(128, 148, 180, .17);
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }

    .card::before {
      position: absolute;
      inset: 0 0 auto;
      height: 4px;
      background: linear-gradient(90deg, #5678f4, #74a8ff);
      content: "";
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 29px;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .shield {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid rgba(85, 117, 230, .17);
      border-radius: 11px;
      color: var(--accent);
      background: rgba(85, 117, 230, .09);
    }

    h1 {
      margin: 0 0 7px;
      font-size: clamp(1.35rem, 5vw, 1.65rem);
      font-weight: 720;
      letter-spacing: -.045em;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: .94rem;
    }

    .divider {
      height: 1px;
      margin: 27px 0 24px;
      border: 0;
      background: var(--line);
    }

    .detail-label {
      display: block;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .recipient-row {
      display: flex;
      min-height: 42px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 21px;
    }

    .recipient-name {
      min-width: 0;
      font-size: 1rem;
      font-weight: 650;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .icon-button {
      display: grid;
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      transition: color .18s ease, border-color .18s ease, background .18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-button:hover,
    .icon-button:focus-visible {
      border-color: rgba(49, 94, 232, .35);
      color: var(--accent);
      background: rgba(49, 94, 232, .06);
    }

    .icon-button:focus-visible,
    .copy-button:focus-visible {
      outline: 3px solid rgba(80, 119, 236, .35);
      outline-offset: 3px;
    }

    .bank-name {
      margin: 0 0 22px;
      font-size: .96rem;
      font-weight: 600;
    }

    .iban-box {
      padding: 15px 14px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(128, 148, 180, .055);
    }

    .iban-number {
      display: block;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: clamp(.91rem, 4vw, 1.05rem);
      font-weight: 650;
      letter-spacing: .035em;
      line-height: 1.55;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .copy-button {
      display: flex;
      width: 100%;
      min-height: 58px;
      align-items: center;
      justify-content: center;
      gap: 11px;
      margin-top: 15px;
      padding: 14px 18px;
      border: 0;
      border-radius: 16px;
      color: #fff;
      background: var(--accent);
      box-shadow: 0 8px 18px rgba(49, 94, 232, .2);
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s ease, transform .15s ease, box-shadow .2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .copy-button:hover { background: var(--accent-dark); }
    .copy-button:active { transform: scale(.985); }

    .copy-button.is-copied {
      background: var(--success);
      box-shadow: 0 8px 18px rgba(22, 134, 87, .18);
    }

    .copy-button.is-copied:hover { background: var(--success-dark); }

    .footer-note {
      margin: 21px 0 0;
      color: var(--muted);
      font-size: .78rem;
      text-align: center;
    }

    .footer-note svg { vertical-align: -3px; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    @media (max-height: 640px) {
      body { padding-top: 12px; padding-bottom: 12px; }
      .card { padding-top: 24px; padding-bottom: 24px; }
      .eyebrow { margin-bottom: 18px; }
      .divider { margin-top: 19px; margin-bottom: 18px; }
      .recipient-row { margin-bottom: 14px; }
      .bank-name { margin-bottom: 15px; }
      .footer-note { margin-top: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <article class="card" aria-labelledby="recipient-name">
      <p class="eyebrow">
        <span class="shield" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 3 19 6v5c0 4.7-3 8-7 10-4-2-7-5.3-7-10V6l7-3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        Güvenli ödeme bilgisi
      </p>

      <h1 id="recipient-name">[AD SOYAD VEYA İŞLETME ADI]</h1>
      <p class="subtitle">IBAN bilgilerini kolayca paylaşın</p>

      <hr class="divider">

      <section aria-label="Hesap bilgileri">
        <span class="detail-label">Alıcı adı</span>
        <div class="recipient-row">
          <span class="recipient-name">[AD SOYAD VEYA İŞLETME ADI]</span>
          <button class="icon-button" id="copy-name" type="button" aria-label="Alıcı adını kopyala" title="Adı kopyala">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="8" y="8" width="12" height="13" rx="2" stroke="currentColor" stroke-width="1.7"/>
              <path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.7"/>
            </svg>
          </button>
        </div>

        <span class="detail-label">Banka</span>
        <p class="bank-name">BANKA ADI</p>

        <span class="detail-label">IBAN numarası</span>
        <div class="iban-box">
          <span class="iban-number" id="iban-number">TR00 0000 0000 0000 0000 0000 00</span>
        </div>
        <button class="copy-button" id="copy-iban" type="button">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="8" y="8" width="12" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          <span>IBAN'ı Kopyala</span>
        </button>
      </section>

      <p class="footer-note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3 19 6v5c0 4.7-3 8-7 10-4-2-7-5.3-7-10V6l7-3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        Bilgileriniz güvenli şekilde paylaşılır
      </p>
      <span class="sr-only" id="copy-status" role="status" aria-live="polite"></span>
    </article>
  </main>

  <script>
    (() => {
      const ibanText = document.getElementById("iban-number").textContent;
      const iban = ibanText.replace(/\s+/g, "").replace(/[\[\]]/g, "");
      const recipient = document.getElementById("recipient-name").textContent.trim();
      const copyButton = document.getElementById("copy-iban");
      const copyNameButton = document.getElementById("copy-name");
      const status = document.getElementById("copy-status");
      let resetTimer;

      async function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (error) {
            // Clipboard access may be denied; try the compatibility fallback.
          }
        }

        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();

        let copied = false;
        try {
          copied = document.execCommand("copy");
        } finally {
          textarea.remove();
        }
        return copied;
      }

      copyButton.addEventListener("click", async () => {
        try {
          const copied = await copyText(iban);
          if (!copied) throw new Error("Pano kopyalama başarısız.");

          window.clearTimeout(resetTimer);
          copyButton.classList.add("is-copied");
          copyButton.querySelector("span").textContent = "Kopyalandı ✓";
          status.textContent = "IBAN panoya kopyalandı.";
          resetTimer = window.setTimeout(() => {
            copyButton.classList.remove("is-copied");
            copyButton.querySelector("span").textContent = "IBAN'ı Kopyala";
          }, 3000);
        } catch (error) {
          status.textContent = "Kopyalama başarısız. Lütfen tekrar deneyin.";
          console.error("IBAN panoya kopyalanamadı:", error);
        }
      });

      copyNameButton.addEventListener("click", async () => {
        try {
          const copied = await copyText(recipient);
          if (!copied) throw new Error("Pano kopyalama başarısız.");
          status.textContent = "Alıcı adı panoya kopyalandı.";
        } catch (error) {
          status.textContent = "Ad kopyalanamadı. Lütfen tekrar deneyin.";
          console.error("Alıcı adı panoya kopyalanamadı:", error);
        }
      });
    })();
  </script>
</body>
</html>
