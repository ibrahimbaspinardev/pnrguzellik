<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f1f1f">
  <meta name="description" content="PNR Güzellik Salonu IBAN ve hızlı ödeme bilgileri.">
  <title>PNR Güzellik Salonu | Hızlı Ödeme</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      --page: #1f1f1f;
      --card: rgba(32, 30, 26, .88);
      --text: #f6f0df;
      --muted: #b7ad95;
      --line: rgba(212, 175, 55, .25);
      --gold: #d4af37;
      --gold-light: #f1d98c;
      --gold-dark: #b89347;
      --success: #087c58;
      --success-dark: #066448;
      --shadow: 0 28px 80px rgba(0, 0, 0, .58), 0 5px 20px rgba(0, 0, 0, .3);
    }

    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      min-height: 100%;
      background: var(--page);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(14px, env(safe-area-inset-top)) 12px max(14px, env(safe-area-inset-bottom));
      overflow: auto;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% -22%, rgba(212, 175, 55, .09), transparent 58%),
        var(--page);
    }

    main {
      width: min(100%, 410px);
      margin: auto;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 18px clamp(16px, 5vw, 24px) 18px;
      border: 1px solid rgba(212, 175, 55, .25);
      border-radius: 26px;
      background: var(--card);
      box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }

    .card::before {
      position: absolute;
      inset: 0 0 auto;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-dark), var(--gold-light), var(--gold-dark), transparent);
      content: "";
    }

    .brand-logo {
      display: block;
      width: min(210px, 62vw);
      height: 155px;
      margin: 0 auto 6px;
      object-fit: contain;
      object-position: center;
    }

    .divider {
      height: 1px;
      margin: 14px 0;
      border: 0;
      background: var(--line);
    }

    .detail-label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
      text-align: left;
    }

    .recipient-row {
      display: flex;
      min-height: 46px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .icon-button {
      display: inline-flex;
      height: 40px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 8px;
      border: 1px solid rgba(212, 175, 55, .48);
      border-radius: 12px;
      color: var(--gold-light);
      background: rgba(212, 175, 55, .045);
      font: inherit;
      font-size: .7rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: color .18s ease, border-color .18s ease, background .18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-button:hover,
    .icon-button:focus-visible {
      border-color: var(--gold);
      color: #fff1bd;
      background: rgba(212, 175, 55, .12);
    }

    .icon-button:focus-visible,
    .copy-button:focus-visible {
      outline: 3px solid rgba(212, 175, 55, .38);
      outline-offset: 3px;
    }

    .bank-name {
      margin: 0;
      color: #f0dfaf;
      font-size: .88rem;
      font-weight: 600;
    }

    .iban-box {
      margin-top: 10px;
      padding: 12px 10px;
      border: 1px solid rgba(212, 175, 55, .23);
      border-radius: 15px;
      background: rgba(0, 0, 0, .19);
      box-shadow: inset 0 1px 14px rgba(0, 0, 0, .15);
    }

    .iban-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: .66rem;
      font-weight: 750;
      letter-spacing: .1em;
      text-align: center;
      text-transform: uppercase;
    }

    .iban-number {
      display: block;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: clamp(.68rem, 3.45vw, .95rem);
      font-weight: 650;
      letter-spacing: 0;
      line-height: 1.55;
      text-align: center;
      white-space: nowrap;
    }

    .copy-button {
      display: flex;
      width: 100%;
      min-height: 56px;
      align-items: center;
      justify-content: center;
      gap: 11px;
      margin-top: 0;
      padding: 14px 18px;
      border: 0;
      border-radius: 15px;
      color: #201a0b;
      background: linear-gradient(115deg, #b89347 0%, #f1d98c 48%, #d4af37 100%);
      box-shadow: 0 8px 22px rgba(184, 147, 71, .22), inset 0 1px rgba(255, 249, 218, .68);
      font: inherit;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: background .2s ease, transform .15s ease, box-shadow .2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .copy-button:hover { background: linear-gradient(115deg, #c6a457 0%, #f7e5a6 48%, #dfc07a 100%); }
    .copy-button:active { transform: scale(.985); }

    .copy-button.is-copied {
      color: #fff;
      background: var(--success);
      box-shadow: 0 8px 20px rgba(8, 124, 88, .3);
    }

    .copy-button.is-copied:hover { background: var(--success-dark); }

    .footer-note {
      margin: 15px 0 0;
      color: var(--muted);
      font-size: .72rem;
      text-align: center;
    }

    .footer-note svg { vertical-align: -3px; }

    .recipient-name {
      display: block;
      min-width: 0;
      color: #f5e8c1;
      font-size: .88rem;
      font-weight: 650;
      line-height: 1.4;
      white-space: nowrap;
    }

    .bank-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-top: 2px;
    }

    .bank-row .detail-label { margin: 0; }

    .copy-name-label { line-height: 1; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    @media (max-height: 640px) {
      .card { padding-top: 14px; padding-bottom: 14px; }
      .divider { margin-top: 11px; margin-bottom: 11px; }
      .recipient-row { margin-bottom: 8px; }
      .footer-note { margin-top: 10px; }
    }

    @media (max-height: 520px) {
      body { place-items: start center; }
      .brand-logo { height: 126px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <article class="card" aria-label="PNR Güzellik Salonu IBAN ve hızlı ödeme bilgileri">
      <img class="brand-logo" src="logo.png" alt="PNR Güzellik Salonu">

      <button class="copy-button" id="copy-iban" type="button">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="8" y="8" width="12" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/>
          <path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        <span>IBAN'ı Kopyala</span>
      </button>

      <div class="iban-box">
        <span class="iban-label">IBAN numarası</span>
        <span class="iban-number" id="iban-number">TR38 0006 2000 3020 0006 2979 98</span>
      </div>

      <hr class="divider">

      <section aria-label="PNR Güzellik Salonu hesap bilgileri">
        <div class="recipient-row">
          <p class="recipient-name" id="recipient-name">Alıcı: Pınar Mermer</p>
          <button class="icon-button" id="copy-name" type="button" aria-label="Pınar Mermer adını kopyala" title="Alıcı adını kopyala">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="8" y="8" width="12" height="13" rx="2" stroke="currentColor" stroke-width="1.7"/>
              <path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.7"/>
            </svg>
            <span class="copy-name-label">Adı Kopyala</span>
          </button>
        </div>

        <div class="bank-row">
          <span class="detail-label">Banka</span>
          <p class="bank-name">Garanti BBVA</p>
        </div>
      </section>

      <p class="footer-note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3 19 6v5c0 4.7-3 8-7 10-4-2-7-5.3-7-10V6l7-3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        Bilgileriniz güvenli şekilde paylaşılır
      </p>
      <span class="sr-only" id="copy-status" role="status" aria-live="polite"></span>
    </article>
  </main>

  <script>
    (() => {
      const iban = "TR380006200030200006297998";
      const recipient = "Pınar Mermer";
      const copyButton = document.getElementById("copy-iban");
      const copyNameButton = document.getElementById("copy-name");
      const status = document.getElementById("copy-status");
      const copyNameLabel = copyNameButton.querySelector(".copy-name-label");
      let resetTimer;
      let nameResetTimer;

      async function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (error) {
            // Clipboard access may be denied; try the compatibility fallback.
          }
        }

        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        textarea.setSelectionRange(0, text.length);

        let copied = false;
        try {
          copied = document.execCommand("copy");
        } finally {
          textarea.remove();
        }
        return copied;
      }

      copyButton.addEventListener("click", async () => {
        try {
          const copied = await copyText(iban);
          if (!copied) throw new Error("Pano kopyalama başarısız.");

          window.clearTimeout(resetTimer);
          copyButton.classList.add("is-copied");
          copyButton.querySelector("span").textContent = "Kopyalandı ✓";
          status.textContent = "IBAN panoya kopyalandı.";
          if (typeof navigator.vibrate === "function") navigator.vibrate(35);
          resetTimer = window.setTimeout(() => {
            copyButton.classList.remove("is-copied");
            copyButton.querySelector("span").textContent = "IBAN'ı Kopyala";
          }, 3000);
        } catch (error) {
          status.textContent = "Kopyalama başarısız. Lütfen tekrar deneyin.";
          console.error("IBAN panoya kopyalanamadı:", error);
        }
      });

      copyNameButton.addEventListener("click", async () => {
        try {
          const copied = await copyText(recipient);
          if (!copied) throw new Error("Pano kopyalama başarısız.");
          window.clearTimeout(nameResetTimer);
          copyNameLabel.textContent = "Kopyalandı ✓";
          status.textContent = "Alıcı adı panoya kopyalandı.";
          nameResetTimer = window.setTimeout(() => {
            copyNameLabel.textContent = "Adı Kopyala";
          }, 2000);
        } catch (error) {
          status.textContent = "Ad kopyalanamadı. Lütfen tekrar deneyin.";
          console.error("Alıcı adı panoya kopyalanamadı:", error);
        }
      });
    })();
  </script>
</body>
</html>
